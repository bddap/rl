[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
net = { path = "../net", features = ["render"] }
net-proto = { path = "../net-proto" }
crab-world = { path = "../crab-world", features = ["render"] }
otel = { path = "../otel" }
anyhow.workspace = true
clap.workspace = true
iroh.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
