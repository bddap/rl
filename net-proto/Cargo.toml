[package]
name = "net-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

# The platform-free protocol core (rl#411 stage 2): deterministic sim, wire codecs,
# snapshots, roster/membership — everything above the link seam. No tokio, no iroh
# (iroh-base only, for the EndpointId key type), no cfg(target_*) anywhere: the
# wasm32 check in test-map.json enforces platform-freedom by construction.

[lib]
name = "net_proto"
path = "src/lib.rs"

[dependencies]
crab-world = { path = "../crab-world" }
# Math types only (Vec3 in the pilot/articulation wire structs) — no bevy runtime.
bevy = { workspace = true, features = ["std"] }
tracing.workspace = true
rand.workspace = true
rand_chacha.workspace = true
anyhow.workspace = true
# EndpointId is a pure ed25519 key — the one identity type shared with the link layer.
iroh-base.workspace = true

[dev-dependencies]
test-watchdog = { path = "../test-watchdog" }

# The wasm32 platform-freedom check needs entropy backends named explicitly:
# rand 0.8 pulls getrandom 0.2 (feature `js`), and getrandom 0.3 additionally
# wants the backend cfg in .cargo/config.toml. Target-scoped: native unaffected.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
