[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# rl#411: getrandom 0.3 refuses wasm32-unknown-unknown unless the backend is named
# explicitly (the `wasm_js` FEATURE alone is deliberately insufficient upstream).
# Scoped to the wasm target, so native builds see no flag change.
# strip=debuginfo (rl#411 stage 6): the shipped web bundle carries no DWARF — it was
# ~half of an 81 MB wasm; browser-side names come from wasm-bindgen, not debuginfo.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'strip=debuginfo']
