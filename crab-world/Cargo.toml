[package]
name = "crab-world"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "crab_world"
path = "src/lib.rs"

[features]
render = ["bevy/default", "bevy_rapier3d/default", "dep:frametime"]

wgpu = ["burn/wgpu"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
] }
bevy_rapier3d = { workspace = true, features = ["dim3"] }
# Resolves THROUGH the workspace [patch] to the one fork rev (`net` uses the same
# shape for its profiler dep); only here to switch on rapier serde for
# `physics::snapshot`.
rapier3d = { version = "0.35.0-glamx0.2", default-features = false, features = [
    "serde-serialize",
] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
burn.workspace = true
# burn's cubecl-wgpu backend pulls naga 26 into every build (via `autodiff` → cubecl),
# regardless of the `wgpu` feature. Bevy ≤0.18 used naga 26 too and enabled its
# `termcolor` feature; bevy 0.19 moved to naga 29, so nothing turns on naga 26's
# `termcolor` anymore and it fails to compile (`WriteColor for String` in its WGSL
# diagnostics). Re-enable it here — naga 26 is already in the graph, so this adds only
# the feature, not a crate.
naga = { workspace = true, features = ["termcolor"] }
clap.workspace = true
bincode.workspace = true
# asset_pack's deflate (rl#411 stage 6): pure-rust miniz backend, wasm-clean.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc.workspace = true
rayon.workspace = true
tracing.workspace = true
# Frame-time telemetry recorder (frame_telemetry.rs) — rendered surfaces only. The
# exporter half stays out of this crate: binaries arm it via otel::init (rl#411).
frametime = { path = "../frametime", optional = true }

[[example]]
name = "perf_collapse_smoke"
required-features = ["render"]

[dev-dependencies]
test-watchdog = { path = "../test-watchdog" }
# Tests pin the tracing-target constants to otel's; the perf_collapse_smoke example
# arms real export.
otel = { path = "../otel" }
# The runtime never parses the glb (colliders come from the baked table, bddap/rl#20);
# only the skin-weight audit tests still read it directly.
gltf.workspace = true

# `wall::unix_ms`'s browser clock (Date.now). Already in the tree via wasm-bindgen.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
