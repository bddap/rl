[package]
name = "crab-world"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "crab_world"
path = "src/lib.rs"

[features]
render = ["bevy/default", "bevy_rapier3d/default", "dep:frametime"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
] }
bevy_rapier3d = { workspace = true, features = ["dim3"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
bincode.workspace = true
# asset_pack's deflate (rl#411 stage 6): pure-rust miniz backend, wasm-clean.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing.workspace = true
# Frame-time telemetry recorder (frame_telemetry.rs) — rendered surfaces only. The
# exporter half stays out of this crate: binaries arm it via otel::init (rl#411).
frametime = { path = "../frametime", optional = true }

[[example]]
name = "perf_collapse_smoke"
required-features = ["render"]

[dev-dependencies]
tracing-subscriber.workspace = true
# Tests pin the tracing-target constants to otel's; the perf_collapse_smoke example
# arms real export.
otel = { path = "../otel" }

# `wall::unix_ms`'s browser clock (Date.now). Already in the tree via wasm-bindgen.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
