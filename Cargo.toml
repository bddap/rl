[workspace]
resolver = "3"
members = [
    "crab-world",
    "net",
    "net-link",
    "net-proto",
    "game-web",
    "rl-train",
    "rl-demo",
    "game",
    "rl-update-ui",
    "otel",
    "frametime",
    "meshfit",
    "test-watchdog",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
bevy_rapier3d = { version = "0.36", default-features = false }
bevy_egui = "0.41"

rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }

burn = { version = "0.20", features = ["autodiff", "ndarray"] }
naga = { version = "26" }
clap = { version = "4", features = ["derive", "env"] }
bincode = "1"
# One POSIX syscall std doesn't expose: setpriority (nice the in-process trainer so a
# foreground game preempts it — `training/inproc.rs`). Already in the tree
# transitively, so it adds no new crate.
libc = "0.2"
# Already in the tree via burn-ndarray; a direct dep only so the single-thread pin can
# read back the global pool's width (`bot/headless.rs`, bddap/rl#345).
rayon = "1"
ctor = "1.0.9"

iroh = "1"
# The protocol core's ONLY iroh surface: EndpointId, a pure ed25519 key (rl#411).
iroh-base = { version = "1", default-features = false, features = ["key"] }
# The type iroh's send_datagram takes; already in the tree transitively via iroh.
bytes = "1"
iroh-mdns-address-lookup = "0.4"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand_chacha = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

# The shipped web bundle (rl#411 stage 6): the wasm is fetched whole on page load, so
# trade link time for size. Thin LTO roughly halves the code section; native builds
# keep the plain release profile (mold + no LTO = fast iteration).
[profile.web-release]
inherits = "release"
lto = "thin"
# "s" over 3: ~a third off the code section, and the wasm must stay well clear of
# the host's 100 MB per-file ceiling as the game grows. Sim cost is a few percent;
# the web build's bottleneck is the renderer, not the sim (stage-5 numbers).
opt-level = "s"

[patch.crates-io]
rapier3d = { git = "https://github.com/bddap-bot/rapier", rev = "8a5d9859edbcd3fca6eeb6bd53bd6acb32cf00c5" }
