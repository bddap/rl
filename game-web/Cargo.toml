[package]
name = "game-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser entry adapter (rl#411): the web peer of `game`'s CLI adapter.
# Everything inside is cfg'd wasm, so native workspace builds compile an empty crate.

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
net = { path = "../net", features = ["render"] }
crab-world = { path = "../crab-world", features = ["render"] }
frametime = { path = "../frametime" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# EXACT pins (rl#411 stage 6): the wasm-bindgen CLI that post-processes the build is
# the one shell.nix ships, and its version must equal the crate's (run.sh asserts).
# These pins move in lockstep with each other AND with a shell.nix nixpkgs bump.
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = ["console", "Window", "Document", "Element"] }
console_error_panic_hook = "0.1"
