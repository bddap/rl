[package]
name = "game-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser entry adapter (rl#411): the web peer of `game`'s CLI adapter.
# Everything inside is cfg'd wasm, so native workspace builds compile an empty crate.

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
net = { path = "../net", features = ["render"] }
crab-world = { path = "../crab-world", features = ["render"] }
frametime = { path = "../frametime" }
anyhow.workspace = true
# try_join_all for the concurrent asset prefetch; already in the tree via bevy.
futures = { version = "0.3", default-features = false, features = ["alloc"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Response"] }
console_error_panic_hook = "0.1"
