# Manual macOS arm64 build of the shipped binaries. The fleet has no macOS
# hardware, so hosted runners are the one build path for this target. The
# artifact carries binaries only — assets are fetched/staged separately
# (scripts/fetch-*.sh), same split as every other packaging path.
name: macOS build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - name: Build
        run: cargo build --release -p game -p rl-demo
      - name: Stage
        run: |
          mkdir dist
          cp target/release/game target/release/rl-demo dist/
          shasum -a 256 dist/* | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/
          if-no-files-found: error
