[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "net"
path = "src/lib.rs"

[features]
render = [
    "crab-world/render",
    "bevy/default",
    "bevy_rapier3d/default",
    "dep:bevy_egui",
    "dep:cpal",
    "dep:chrono",
]

[dependencies]
crab-world = { path = "../crab-world" }
net-link = { path = "../net-link" }
net-proto = { path = "../net-proto" }
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
] }
bevy_rapier3d = { workspace = true, features = ["dim3"] }
# Already in the tree via bevy_rapier3d (the workspace [patch] rewrites this to the
# fork); a direct dep only to switch on rapier's `profiler` feature, which is what
# makes the pipeline counters the rl#396 step profile reads actually time anything.
# Deliberately a crates-io spec, NOT a second copy of the fork's git rev: the [patch]
# stays the one rev pin, and this resolves THROUGH it to the same package. The req
# must name the fork's exact prerelease version (caret reqs skip prereleases); if the
# fork ever bumps its version string, this fails resolution loudly — fix the one line
# — rather than silently splitting the graph into a with- and without-profiler copy.
rapier3d = { version = "0.35.0-glamx0.2", default-features = false, features = [
    "profiler",
] }
bevy_egui = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
bincode.workspace = true
rand_chacha.workspace = true

iroh.workspace = true
bytes.workspace = true
n0-future.workspace = true
anyhow.workspace = true
tracing.workspace = true

# The native-only slice (rl#411): the telemetry sender/collector own a tokio
# runtime + mDNS discovery, voice capture speaks cpal, screenshot filenames stamp via
# chrono. None of these exist on wasm — the modules that use them are cfg'd native,
# and scoping the deps here is what keeps the wasm build honest (a new native-only
# use in shared code fails to COMPILE instead of panicking in a browser).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true
iroh-mdns-address-lookup.workspace = true
# Mic capture for voice notes (rl#378). Already in the tree transitively via
# bevy_audio → rodio, so this adds no new crate to the build.
cpal = { version = "0.15", optional = true }
# Screenshot filenames (rl#405). Already in the tree via bevy's dep graph.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }

# The browser↔native cross-play verify probe (examples/web-form, rl#412) — the
# formation-level sibling of net-link's echo probe; rerun it when touching the lobby
# bind seam, relay posture, or bumping iroh.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[[example]]
name = "form_web"
crate-type = ["cdylib"]

[dev-dependencies]
crab-world = { path = "../crab-world" }

# Native-only test plumbing: neither exists on wasm, and an unconditional dev-dep
# would drag them into the wasm example build above.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
test-watchdog = { path = "../test-watchdog" }
# The net_track targets must match otel's constants (tracing wants literal targets).
otel = { path = "../otel" }
