[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "net"
path = "src/lib.rs"

[features]
render = [
    "crab-world/render",
    "bevy/default",
    "bevy_rapier3d/default",
    "dep:bevy_egui",
    "dep:chrono",
]

[dependencies]
crab-world = { path = "../crab-world" }
net-link = { path = "../net-link" }
net-proto = { path = "../net-proto" }
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
] }
bevy_rapier3d = { workspace = true, features = ["dim3"] }
bevy_egui = { workspace = true, optional = true }
rand.workspace = true
rand_chacha.workspace = true

iroh.workspace = true
n0-future.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Native-only: screenshot filenames stamp via chrono, which has no clock on
# wasm; scoping the dep keeps a native-only use in shared code a compile error.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }

# The browser↔native cross-play verify probe (examples/web-form, rl#412); rerun it
# when touching the lobby bind seam, relay posture, or bumping iroh.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[[example]]
name = "form_web"
crate-type = ["cdylib"]

[dev-dependencies]
crab-world = { path = "../crab-world" }

# Native-only test plumbing: neither exists on wasm, and an unconditional dev-dep
# would drag them into the wasm example build above.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The tracing targets must match otel's constants (tracing wants literal targets).
otel = { path = "../otel" }
